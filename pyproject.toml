[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# The distribution name is NOT the repo name. The bare `depscan` name on PyPI
# belongs to an unrelated third-party project (linkedlist771/depscan), so
# claiming it would be an unpublishable collision and every bare
# `pip install depscan` would silently hand the reader someone else's package.
# `-py` is the same disambiguation convention used by pytest, coverage and
# friends. The console script stays `depscan` -- only the distribution name
# carries the suffix.
name = "depscan-py"
version = "0.2.0"
description = "Multi-ecosystem dependency scanner with typosquat detection"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Yunaremaia", email = "yunare@gmail.com"}]
keywords = ["security", "dependencies", "typosquat", "scanner", "sbom"]
dependencies = ["click>=8.1", "rich>=13.0", "PyYAML>=6.0", "tomli>=1.1; python_version < '3.11'"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.1"]

[project.scripts]
depscan = "depscan.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.report]
# Measured floor, not a target: 84.89% (1034/1218 stmts) on the full suite, so
# this only fails on real regression. Bump it as tests land.
fail_under = 84
