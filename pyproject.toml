[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "depscan"
version = "0.1.0"
description = "Multi-ecosystem dependency scanner with typosquat detection"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Yunaremaia", email = "yunare@gmail.com"}]
keywords = ["security", "dependencies", "typosquat", "scanner", "sbom"]
dependencies = ["click>=8.1", "rich>=13.0", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
depscan = "depscan.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
